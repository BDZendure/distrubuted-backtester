name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install --editable ".[dev,benchmark,storage]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy src tests scripts/smoke.py
      - name: Test
        env:
          PHASE5_STORAGE_CHILD_TESTS: "1"
        run: python -m pytest
      - name: Check dependencies
        run: python -m pip check
      - name: Build distributions
        run: python -m build
      - name: Verify wheel installation outside the checkout
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install --no-deps dist/*.whl
          wheel_python="$PWD/.venv-wheel/bin/python"
          sample_data="$PWD/examples/sma.csv"
          smoke_script="$PWD/scripts/smoke.py"
          cd "$RUNNER_TEMP"
          "$wheel_python" -I -m pip check
          "$wheel_python" -I "$smoke_script" --data "$sample_data" \
            --output-parent "$RUNNER_TEMP/core-wheel-smoke" --timeout 120 --signals
      - name: Retain core installed smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-wheel-smoke-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/core-wheel-smoke/
          if-no-files-found: ignore
          retention-days: 7

  ray-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install optional distributed dependencies
        run: python -m pip install --editable ".[dev,benchmark,distributed,storage]"
      - name: Test real Ray execution and measurement boundaries
        run: python -m pytest tests/test_ray*.py tests/test_scheduler_faults.py tests/test_storage_ray.py
      - name: Exercise the cold comparison harness
        run: |
          python -m distributed_backtester.ray_benchmark run \
            --bars 8 --jobs 3 --workers 2 --repetitions 1 \
            --discard-trial-results --output-dir artifacts/ci-ray-smoke
      - name: Build and smoke installed optional extras outside the checkout
        run: |
          python -m build
          python -m venv .venv-ray-wheel
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          .venv-ray-wheel/bin/python -m pip install "${wheels[0]}[benchmark,distributed,storage]"
          wheel_python="$PWD/.venv-ray-wheel/bin/python"
          sample_data="$PWD/examples/sma.csv"
          smoke_script="$PWD/scripts/smoke.py"
          cd "$RUNNER_TEMP"
          "$wheel_python" -I -m pip check
          "$wheel_python" -I "$smoke_script" --data "$sample_data" \
            --output-parent "$RUNNER_TEMP/ray-wheel-smoke" --timeout 180 \
            --ray --storage --signals
      - name: Retain optional installed smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ray-wheel-smoke-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/ray-wheel-smoke/
          if-no-files-found: ignore
          retention-days: 7

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUNTIME_IMAGE: distributed-backtester:ci-runtime
      DEV_IMAGE: distributed-backtester:ci-dev
      SMOKE_CONTAINER: phase7-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_VOLUME: phase7-outputs-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Record actual Docker availability
        run: |
          mkdir -p "$RUNNER_TEMP/container-smoke"
          docker version > "$RUNNER_TEMP/container-smoke/docker-version.txt"
          docker info > "$RUNNER_TEMP/container-smoke/docker-info.txt"
          df -h > "$RUNNER_TEMP/container-smoke/disk.txt"
      - name: Build installed runtime and dev images
        run: |
          docker build --target runtime --build-arg VCS_REF="$GITHUB_SHA" \
            --tag "$RUNTIME_IMAGE" .
          docker build --target dev --build-arg VCS_REF="$GITHUB_SHA" \
            --tag "$DEV_IMAGE" .
          docker image inspect "$RUNTIME_IMAGE" "$DEV_IMAGE" \
            > "$RUNNER_TEMP/container-smoke/images.json"
      - name: Verify nonroot installed runtime and development tools
        run: |
          docker run --rm --init --cpus=2 --memory=4g --memory-swap=4g \
            --shm-size=256m --entrypoint python "$RUNTIME_IMAGE" -I -c \
            'import json, os, pathlib, distributed_backtester as p; assert os.getuid() == 10001; assert pathlib.Path(p.__file__).is_relative_to("/opt/venv"); print(json.dumps({"uid": os.getuid(), "package": p.__file__}))' \
            > "$RUNNER_TEMP/container-smoke/installed.json"
          docker run --rm --init --entrypoint python "$RUNTIME_IMAGE" -I -m pip check
          docker run --rm --init --entrypoint python "$DEV_IMAGE" -I -m pip check
          docker run --rm --init --entrypoint python "$DEV_IMAGE" -I -m ruff check /workspace
          docker run --rm --init --entrypoint python "$DEV_IMAGE" -I -m ruff format --check /workspace
          docker run --rm --init --workdir /workspace --entrypoint python "$DEV_IMAGE" \
            -I -m mypy src tests scripts/smoke.py
          docker run --name "${SMOKE_CONTAINER}-dev" --init --cpus=2 --memory=4g --memory-swap=4g \
            --shm-size=256m --entrypoint python "$DEV_IMAGE" \
            -I /opt/backtester/scripts/smoke.py \
            --data /opt/backtester/examples/sma.csv --output-parent /outputs/dev --timeout 120
      - name: Create persistent output and inspect enforced resource limits
        run: |
          docker volume create "$SMOKE_VOLUME"
          docker create --name "$SMOKE_CONTAINER" --init \
            --cpus=2 --memory=4g --memory-swap=4g --shm-size=256m --stop-timeout=30 \
            --mount "type=bind,source=$PWD/examples,target=/inputs,readonly" \
            --mount "type=volume,source=$SMOKE_VOLUME,target=/outputs" \
            --entrypoint python "$RUNTIME_IMAGE" -I /opt/backtester/scripts/smoke.py \
            --data /inputs/sma.csv --output-parent /outputs --timeout 180 \
            --ray --storage --signals
          docker inspect "$SMOKE_CONTAINER" > "$RUNNER_TEMP/container-smoke/container.json"
          python3 - "$RUNNER_TEMP/container-smoke/container.json" <<'PY'
          import json, sys
          record = json.load(open(sys.argv[1]))[0]
          limits = record["HostConfig"]
          assert record["Config"]["User"] == "10001:10001"
          assert limits["NanoCpus"] == 2_000_000_000
          assert limits["Memory"] == limits["MemorySwap"] == 4 * 1024**3
          assert limits["ShmSize"] == 256 * 1024**2 and limits["Init"] is True
          assert record["Config"]["StopTimeout"] == 30
          assert any(m["Destination"] == "/inputs" and not m["RW"] for m in record["Mounts"])
          PY
      - name: Run actual container operational smoke
        run: |
          timeout --signal=TERM --kill-after=35s 15m docker start --attach "$SMOKE_CONTAINER"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$SMOKE_CONTAINER")" -eq 0
      - name: Capture persistent outputs after container removal
        if: always()
        run: |
          if docker container inspect "${SMOKE_CONTAINER}-dev" >/dev/null 2>&1; then
            docker stop --timeout 30 "${SMOKE_CONTAINER}-dev"
            docker inspect "${SMOKE_CONTAINER}-dev" > "$RUNNER_TEMP/container-smoke/dev-final.json"
            docker cp "${SMOKE_CONTAINER}-dev:/outputs/." "$RUNNER_TEMP/container-smoke/dev-outputs"
            docker rm --force "${SMOKE_CONTAINER}-dev"
          fi
          if docker container inspect "$SMOKE_CONTAINER" >/dev/null 2>&1; then
            docker stop --timeout 30 "$SMOKE_CONTAINER"
            docker inspect "$SMOKE_CONTAINER" > "$RUNNER_TEMP/container-smoke/container-final.json"
            docker logs "$SMOKE_CONTAINER" > "$RUNNER_TEMP/container-smoke/container.stdout" \
              2> "$RUNNER_TEMP/container-smoke/container.stderr"
            docker cp "$SMOKE_CONTAINER:/outputs/." "$RUNNER_TEMP/container-smoke/outputs"
            # Ray session logs are optional when startup fails before creating them.
            docker cp "$SMOKE_CONTAINER:/tmp/ray/." "$RUNNER_TEMP/container-smoke/ray-sessions" || true
            docker rm --force "$SMOKE_CONTAINER"
            docker run --rm --init \
              --mount "type=volume,source=$SMOKE_VOLUME,target=/outputs,readonly" \
              --entrypoint python "$RUNTIME_IMAGE" -I -c \
              'import json; from pathlib import Path; reports=list(Path("/outputs").glob("smoke-*/report.json")); assert reports; print(json.dumps({"persistent_reports": [str(p) for p in reports]}))' \
              > "$RUNNER_TEMP/container-smoke/persistence.json"
          fi
      - name: Retain container smoke and artifact evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-smoke-linux-amd64
          path: ${{ runner.temp }}/container-smoke/
          if-no-files-found: warn
          retention-days: 7
