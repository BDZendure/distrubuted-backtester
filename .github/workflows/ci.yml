name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install --editable ".[dev,benchmark,storage]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -m pytest
      - name: Check dependencies
        run: python -m pip check
      - name: Build distributions
        run: python -m build
      - name: Verify wheel installation outside the checkout
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install --no-deps dist/*.whl
          wheel_python="$PWD/.venv-wheel/bin/python"
          wheel_cli="$PWD/.venv-wheel/bin/distributed-backtester"
          sample_data="$PWD/examples/sma.csv"
          cd "$RUNNER_TEMP"
          "$wheel_python" -I -c "import distributed_backtester"
          "$wheel_cli" backtest --data "$sample_data" --symbol SYNTH \
            --price-basis raw --fee-bps 10 --output wheel-example.json
          "$wheel_python" -I -c 'import json; from pathlib import Path; r = json.loads(Path("wheel-example.json").read_text()); assert r["metrics"]["final_equity"] == "749.257000"; assert r["metrics"]["fill_count"] == 2'
          "$wheel_cli" sweep --data "$sample_data" --symbol SYNTH \
            --price-basis raw --fast 1 2 --slow 3 4 --fee-bps 10 \
            --backend sequential --output-dir wheel-sequential
          "$wheel_cli" sweep --data "$sample_data" --symbol SYNTH \
            --price-basis raw --fast 1 2 --slow 3 4 --fee-bps 10 \
            --backend process --workers 2 --output-dir wheel-process
          "$wheel_python" -I -c 'from pathlib import Path; from distributed_backtester.benchmark import semantic_digest; assert semantic_digest(Path("wheel-sequential")) == semantic_digest(Path("wheel-process"))'

  ray-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install optional distributed dependencies
        run: python -m pip install --editable ".[dev,benchmark,distributed,storage]"
      - name: Test real Ray execution and measurement boundaries
        run: python -m pytest tests/test_ray*.py tests/test_scheduler_faults.py tests/test_storage_ray.py
      - name: Exercise the cold comparison harness
        run: |
          python -m distributed_backtester.ray_benchmark run \
            --bars 8 --jobs 3 --workers 2 --repetitions 1 \
            --discard-trial-results --output-dir artifacts/ci-ray-smoke
